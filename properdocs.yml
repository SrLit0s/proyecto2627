site_name: "Proyecto Intermodular"
site_description: "Proyecto Intermodular del Ciclo Formativo de Desarrollo de aplicaciones Web"
site_author: "Carlos Martinez Martinez - IES Los Albares"

# Selección del tema Read the Docs
theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - php
    - bash
    - json
    - html

# Estructura de navegación lateral
nav:
  - Inicio: index.md
  - Proyecto 01: proyecto01.md 

# Opciones adicionales
markdown_extensions:
  - tables
  - codehilite
  - pymdownx.superfences
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tilde
  - pymdownx.arithmatex
  - pymdownx.blocks.admonition
  - pymdownx.magiclink
  - pymdownx.keys
  - pymdownx.highlight
  - pymdownx.blocks.definition
